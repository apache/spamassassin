name: 'Setup macOS for SpamAssassin build and test'
description: 'Setup macOS runner for SpamAssassin build and test'
runs:
  using: 'composite'
  steps:
    - name: remove default user group membershipp in root group
      run: |
        # Note this only takes effect in steps that run with sudo -u runner
        sudo dseditgroup -o edit -d runner -t user wheel
        echo "$HOME/.local/bin" >> $GITHUB_PATH
      shell: bash

    - name: install required homebrew apps and create links for some keg-only ones, remove brew perl
      run: |
        HOMEBREW_NO_AUTOREMOVE=1 brew uninstall --formula perl || echo "ignore error if not installed"
        brew install coreutils python3 re2c openssl berkeley-db libmaxminddb libidn libidn2 mysql postgresql
        sudo mkdir -p /usr/local/{bin,include,lib}
        sudo chown runner /usr/local/{bin,include,lib}
        ln -sf /opt/homebrew/opt/berkeley-db/include/* /usr/local/include/
        ln -sf /opt/homebrew/opt/berkeley-db/lib/* /usr/local/lib/
        ln -sf /opt/homebrew/lib/*.dylib /usr/local/lib/
        ln -sf /opt/homebrew/include/* /usr/local/include/
      shell: bash

    - name: install some needed packages from source that aren't in homebrew
      run: |
        mkdir -p ~/tmp
        cd ~/tmp
        wget https://www.dcc-servers.net/dcc/source/dcc.tar.Z
        tar xf dcc.tar.Z
        cd dcc-*
        ./configure --disable-server --disable-dccm --disable-dccifd
        make
        sudo make install

        python3 -m pip install --break-system-packages https://github.com/SpamExperts/pyzor/archive/refs/heads/master.zip
        ln -sf `which pyzor` /usr/local/bin/pyzor
      shell: bash
